name: Recipe checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/build.py scripts/bundle.py scripts/smoke.py
      - run: python3 scripts/build.py --help
      - run: python3 -m unittest discover -s tests
      - run: git diff --check
